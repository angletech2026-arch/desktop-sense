name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: macOS smoke test (Vision OCR, window list, locks, CLI)
        if: runner.os == 'macOS'
        run: python tests/mac_smoke.py
      - name: Shell script syntax
        if: runner.os == 'macOS'
        run: bash -n install.sh && bash -n uninstall.sh && bash -n bin/ds
      - name: macOS end-to-end install (launchd daemon, status, uninstall)
        if: runner.os == 'macOS'
        run: |
          ./install.sh --no-hooks
          export PATH="$HOME/.local/bin:$PATH"
          ds status | tee "$RUNNER_TEMP/status.txt"
          ds now
          ds tail 30 || true
          tail -20 data/launchd.log 2>/dev/null || true
          grep -q "running, pid=" "$RUNNER_TEMP/status.txt"
          launchctl print "gui/$(id -u)/io.angletech.desktop-sense" | tee "$RUNNER_TEMP/launchd.txt" | grep -q "state = running"
          grep -q "desktop-sense.app/Contents/MacOS/desktop-sense" "$RUNNER_TEMP/launchd.txt"   # runs inside the helper app
          codesign --verify "$HOME/Applications/desktop-sense.app"
          ./uninstall.sh --purge
          if launchctl print "gui/$(id -u)/io.angletech.desktop-sense" >/dev/null 2>&1; then echo "LaunchAgent still loaded"; exit 1; fi
          test ! -e "$HOME/Library/LaunchAgents/io.angletech.desktop-sense.plist"
          test ! -e "$HOME/Applications/desktop-sense.app"
