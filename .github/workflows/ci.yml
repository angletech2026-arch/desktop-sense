name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: macOS smoke test (Vision OCR, window list, locks, CLI)
        if: runner.os == 'macOS'
        run: python tests/mac_smoke.py
      - name: Shell script syntax
        if: runner.os == 'macOS'
        run: bash -n install.sh && bash -n uninstall.sh && bash -n bin/ds
      - name: macOS end-to-end install (launchd daemon, status, uninstall)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          ./install.sh --no-hooks
          sleep 15
          export PATH="$HOME/.local/bin:$PATH"
          ds status
          ds now || true
          ds tail 30 || true
          cat data/launchd.log 2>/dev/null | tail -20 || true
          launchctl print "gui/$(id -u)/io.angletech.desktop-sense" | head -20 || true
          ./uninstall.sh --purge
